# Publish the Docker image to Docker Hub on every version tag (v*).
# Builds multi-arch (linux/amd64 + linux/arm64) so Intel/AMD and Apple Silicon
# hosts both pull a native image.
#
# A full check gate (type-check + lint + unit tests + frontend build) runs first;
# the image is only built and pushed when everything is green.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME — Docker Hub account name
#   DOCKERHUB_TOKEN    — Docker Hub access token (Read & Write)
name: Docker publish

on:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Backend — install & check
        working-directory: backend
        run: |
          npm ci
          npm run check

      - name: Frontend — install, check & build
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm run build

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/recensa:${{ steps.ver.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/recensa:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
